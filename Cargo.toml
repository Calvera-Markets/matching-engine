[package]
name = "matching-engine"
version = "0.1.0"
edition = "2024"

[features]
default = ["ouch", "itch"]
ouch = []
itch = []
fix = ["dep:ironfix-core", "dep:ironfix-tagvalue", "dep:ironfix-session"]
sbe = ["dep:ironsbe-core", "dep:ironsbe-codegen"]

[dependencies]
calvera-books = { workspace = true }
libc = "0.2"
ironfix-core = { version = "0.4", optional = true }
ironfix-tagvalue = { version = "0.4", optional = true }
ironfix-session = { version = "0.4", optional = true }
ironsbe-core = { version = "0.4", optional = true }

[build-dependencies]
ironsbe-codegen = { version = "0.4", optional = true }

[dev-dependencies]
criterion = "0.8.2"
dbn = "0.66"
ironfix-core = "0.4"
ironfix-tagvalue = "0.4"

[[bin]]
name = "matching-engine"
path = "src/main.rs"
required-features = ["ouch", "itch"]

[[bench]]
name = "hot"
harness = false

[[example]]
name = "tape_replay"
path = "examples/tape_replay.rs"

[[example]]
name = "fix"
path = "examples/fix.rs"
required-features = ["fix", "itch"]

[[test]]
name = "fix_roundtrip"
path = "tests/fix_roundtrip.rs"
required-features = ["fix"]
